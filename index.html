async function unlock(pw){
 const enc=new TextEncoder();
 const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:Uint8Array.from(atob(P.s),c=>c.charCodeAt(0)),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:Uint8Array.from(atob(P.i),c=>c.charCodeAt(0))},key,Uint8Array.from(atob(P.d),c=>c.charCodeAt(0)));
 return new TextDecoder().decode(pt);}
async function go(pw,save){try{const html=await unlock(pw);
 if(save)localStorage.setItem('tc_pw',pw);
 document.open();document.write(html);document.close();}catch(e){
 localStorage.removeItem('tc_pw');
 document.getElementById('err').textContent='wrong password';}}
document.getElementById('f').addEventListener('submit',ev=>{ev.preventDefault();
 go(document.getElementById('pw').value,true);});
const saved=localStorage.getItem('tc_pw');if(saved)go(saved,false);
</script></body></html>
